# CodeRabbit Configuration File
version: "2"
language: "en-US"
tone_instructions: "Be concise, thorough, and focus on Astro, React, and TypeScript best practices."

reviews:
  profile: "chill"
  request_tools:
    ast-grep:
      enable: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!.astro/**"
    - "!package-lock.json"

chat:
  auto_reply: true
